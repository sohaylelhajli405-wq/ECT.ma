<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECT.MA - Code d'accès</title>
<style>body{background:#0f0f10;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}.box{background:#1a1a1e;border:1px solid #333;border-radius:20px;padding:30px;width:100%;max-width:360px;text-align:center}input{width:100%;background:#111;border:1px solid #2a2a2a;border-radius:10px;padding:12px;margin:10px 0;color:#fff}.btn{width:100%;background:#e6ff32;color:#000;border:none;padding:12px;border-radius:99px;font-weight:800;cursor:pointer}#msg{color:#ff4444;font-size:13px;margin-top:10px}.logo{font-weight:800;font-size:28px}.logo span{color:#e6ff32}</style></head><body>
<div class="box">
<div class="logo">ECT<span>.MA</span></div>
<h2 style="margin:15px 0">Code d'accès</h2>
<p style="color:#666;font-size:13px">دخل الكود باش تدخل للسيت</p>
<input id="nom" placeholder="Smiytek">
<input id="code" placeholder="Code d'accès">
<button class="btn" onclick="check()">Entrer →</button>
<p id="msg"></p>
</div>
<script>
function check(){
let n=document.getElementById('nom').value;
let c=document.getElementById('code').value;
if(c==="SOUHAIL22#"){
localStorage.setItem('ect_logged','1');
localStorage.setItem('ect_user',JSON.stringify({nom:n}));
location.href='index.html';
}else{
document.getElementById('msg').innerText='Code غالط ❌';
}
}
if(localStorage.getItem('ect_logged')=='1'){location.href='index.html';}
</script>
</body></html>
