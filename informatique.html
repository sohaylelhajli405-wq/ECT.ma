<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Quiz - Terminal</title>
<style>
  :root{--bg:#0a0f0a;--panel:#0f1a10;--green:#33ff66;--dim:#1f8f3f;--amber:#ffb000;--red:#ff4d4d;--cyan:#4de1ff;--line:#164d25}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--green);font-family:"Fira Code","Consolas","Courier New",monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
    background-image:repeating-linear-gradient(0deg,rgba(51,255,102,.03) 0 1px,transparent 1px 3px)}
  .term{width:100%;max-width:820px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 0 30px rgba(51,255,102,.15);overflow:hidden}
  .bar{display:flex;align-items:center;gap:8px;background:#0b140c;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--dim)}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .d1{background:#ff5f56}.d2{background:#ffbd2e}.d3{background:#27c93f}
  .bar span.t{margin-left:8px}
  .body{padding:22px;font-size:15px;line-height:1.6}
  h1{font-size:20px;margin:0 0 4px;color:var(--green);text-shadow:0 0 8px rgba(51,255,102,.6)}
  .muted{color:var(--dim)}
  .cursor{display:inline-block;width:9px;height:16px;background:var(--green);vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  button{font:inherit;cursor:pointer;border:1px solid var(--dim);background:transparent;color:var(--green);padding:10px 14px;border-radius:6px;text-align:left;transition:.15s}
  button:hover:not(:disabled){background:rgba(51,255,102,.1);border-color:var(--green)}
  .menu{display:grid;gap:12px;margin-top:18px}
  .menu button{padding:14px}
  .tag{color:var(--amber)}
  .prog{height:6px;background:#0b140c;border:1px solid var(--line);border-radius:4px;margin:12px 0 18px;overflow:hidden}
  .prog>div{height:100%;background:var(--green);width:0;transition:width .3s}
  .q{font-size:17px;margin-bottom:16px;color:#d8ffe3;white-space:pre-wrap}
  .opts{display:grid;gap:10px}
  .opt{width:100%}
  .opt.ok{border-color:var(--green);background:rgba(51,255,102,.18)}
  .opt.ko{border-color:var(--red);background:rgba(255,77,77,.15);color:var(--red)}
  .expl{margin-top:16px;padding:12px;border-left:3px solid var(--cyan);background:rgba(77,225,255,.07);color:var(--cyan);display:none}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap}
  .score{font-size:56px;text-align:center;margin:10px 0;text-shadow:0 0 14px rgba(51,255,102,.7)}
  .center{text-align:center}
  .hidden{display:none}
</style>
</head>
<body>
<div class="term">
  <div class="bar"><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="t">user@python-lab: ~/quiz</span></div>
  <div class="body" id="app"></div>
</div>

<script>
// Format : [question, [options], indexBonneReponse, explication]
const QUIZZES = {
  normal: {
    title: "Quiz NORMAL",
    questions: [
      ["Python est un langage :",["de bas niveau et compilé","de haut niveau, interprété et généraliste","uniquement dédié à l'intelligence artificielle","écrit directement en binaire"],1,"Python est un langage de haut niveau, interprété, généraliste et multiparadigme."],
      ["Quelle technique traduit l'intégralité du texte source en une seule fois et produit un fichier exécutable ?",["L'interprétation","La compilation","L'indentation","L'affectation"],1,"La compilation traduit tout le code d'un coup, l'interprétation le traduit ligne par ligne."],
      ["Lequel de ces identificateurs est valide ?",["2x","if","_nom","mon-nom"],2,"Un identificateur commence par une lettre ou _, et ne contient que lettres, chiffres et _. « if » est un mot-clé."],
      ["Quel symbole introduit un commentaire sur une ligne en Python ?",["//","#","--","/* */"],1,"En Python, un commentaire commence par le dièse (#)."],
      ["Comment Python délimite-t-il un bloc de code ?",["Avec des accolades { }","Avec des points-virgules","Avec l'indentation","Avec les mots begin et end"],2,"Python utilise l'indentation (en général 4 espaces) au lieu des accolades."],
      ["Que renvoie type(88.22) ?",["<class 'int'>","<class 'str'>","<class 'float'>","<class 'bool'>"],2,"88.22 est un nombre réel, donc de type float."],
      ["Que vaut 6 // 4 ?",["1","1.5","2","1.0"],0,"// est la division entière : 6 // 4 = 1."],
      ["Que vaut 6 % 4 ?",["1","2","1.5","24"],1,"% donne le reste de la division entière : 6 = 4×1 + 2."],
      ["Que vaut 2 ** 3 ?",["6","9","5","8"],3,"** est l'opérateur puissance : 2³ = 8."],
      ["Quel est le type de la valeur renvoyée par input() ?",["int","float","str","bool"],2,"input() renvoie toujours une chaîne de caractères ; il faut la convertir avec int() ou float()."],
      ["Comment lire un entier saisi au clavier ?",["n = int(input(\"n : \"))","n = input(int(\"n : \"))","n = print(\"n : \")","n = str(input(\"n : \"))"],0,"On convertit la chaîne renvoyée par input() avec int()."],
      ["Que renvoie l'expression 3 == 4 ?",["True","3","Une erreur","False"],3,"== teste l'égalité : 3 n'est pas égal à 4, donc False."],
      ["Que renvoie 'z' in 'azerty' ?",["True","False","2","Une erreur"],0,"L'opérateur in teste l'appartenance d'une chaîne dans une autre."],
      ["Quel mot-clé ajoute une condition intermédiaire entre if et else ?",["elseif","else if","elif","case"],2,"On utilise la structure if ... elif ... else."],
      ["Que donne list(range(4, 10, 2)) ?",["[4, 6, 8]","[4, 6, 8, 10]","[4, 5, 6, 7, 8, 9]","[6, 8, 10]"],0,"range(début, fin, pas) s'arrête avant la borne de fin (10 exclu)."],
      ["Quelle boucle utilise-t-on quand on ne connaît pas à l'avance le nombre de répétitions ?",["for","while","def","range"],1,"La boucle while répète tant qu'une condition est vraie."],
      ["Quel mot-clé sert à définir une fonction ?",["function","lambda uniquement","return","def"],3,"def (pour « define ») définit une fonction ; lambda crée une fonction anonyme."],
      ["Avec def somme_carre_2(x=2, y=1): return x**2 + y**2, que renvoie somme_carre_2() ?",["5","3","25","Une erreur"],0,"Les valeurs par défaut sont utilisées : 2² + 1² = 5."],
      ["Une variable définie dans une fonction et utilisable seulement à l'intérieur est :",["globale","locale","constante","anonyme"],1,"Une variable locale n'existe que dans la fonction où elle est définie."],
      ["Quelle instruction importe uniquement la fonction sqrt du module math ?",["import sqrt from math","from math import sqrt","import math.sqrt as *","using math.sqrt"],1,"from module import element importe un élément précis d'un module."]
    ]
  },
  hard: {
    title: "Quiz HARD",
    questions: [
      ["Que renvoie type(10 / 2) ?",["<class 'int'>","<class 'float'>","<class 'str'>","<class 'bool'>"],1,"/ renvoie toujours un float en Python 3 : 10 / 2 = 5.0."],
      ["Que affiche print(7 // 2, 7 % 2, -7 // 2) ?",["3 1 -3","3 1 -4","3.5 1 -3.5","4 1 -4"],1,"La division entière arrondit vers le bas : -7 // 2 = -4."],
      ["Que affiche print(2 ** 3 ** 2) ?",["64","36","512","8"],2,"** est associatif à droite : 2 ** (3 ** 2) = 2 ** 9 = 512."],
      ["Que affiche print(1 < 3 > 2) ?",["True","False","Une erreur","3"],0,"Comparaison chaînée : (1 < 3) and (3 > 2) = True."],
      ["Que affiche : a = [1, 2] ; b = a ; b.append(3) ; print(a) ?",["[1, 2]","[1, 2, 3]","[3]","Une erreur"],1,"a et b référencent le même objet liste : modifier l'un modifie l'autre."],
      ["Que affiche print(\"5\" * 3) ?",["15","555","Une erreur","5 5 5"],1,"Multiplier une chaîne par un entier la répète : \"555\"."],
      ["Que affiche print(\"5\" + \"3\") ?",["8","53","Une erreur","5 3"],1,"+ concatène deux chaînes."],
      ["Que affiche : a, b = 1, 2 ; a, b = b, a + b ; print(a, b) ?",["2 3","2 2","1 3","3 3"],0,"Le membre de droite est évalué en entier avant l'affectation : (2, 1+2) = (2, 3)."],
      ["Que affiche print(1, 2, 3, sep='-', end='!') ?",["1-2-3!","1 2 3!","1-2-3","123!"],0,"sep remplace l'espace entre les valeurs, end remplace le retour à la ligne final."],
      ["Que affiche : print(\"a\", end=\"\") ; print(\"b\") ?",["a et b sur deux lignes","a b","ab","Une erreur"],2,"end=\"\" supprime le retour à la ligne : ab."],
      ["Combien d'éléments contient list(range(5, 0, -2)) ?",["2","3","4","5"],1,"On obtient [5, 3, 1] : le 0 est exclu."],
      ["Que donne list(range(10, 0, -3)) ?",["[10, 7, 4, 1]","[10, 7, 4, 1, 0]","[9, 6, 3]","[]"],0,"On part de 10 et on soustrait 3 tant qu'on reste strictement supérieur à 0."],
      ["Que donne list(enumerate('ab')) ?",["['a', 'b']","[(0, 'a'), (1, 'b')]","[(1, 'a'), (2, 'b')]","[('a', 0), ('b', 1)]"],1,"enumerate fournit des couples (indice, valeur) en commençant à 0."],
      ["Valeur finale de t ?\n t = \"\"\n for i, c in enumerate(\"abc\"):\n     t = c + str(i) + t",["a0b1c2","c2b1a0","abc012","0a1b2c"],1,"Chaque nouveau morceau est placé devant t : \"a0\", \"b1a0\", puis \"c2b1a0\"."],
      ["Combien de fois le corps de la boucle s'exécute-t-il ?\n i = 1\n while i <= 5:\n     ...\n     i += 2",["2","3","4","5"],1,"i prend les valeurs 1, 3 et 5, puis 7 arrête la boucle."],
      ["Que affiche (print hors de la boucle) ?\n i = 0\n while i < 3:\n     i += 1\n print(i)",["0","2","3","Rien"],2,"La boucle s'arrête quand i vaut 3, et c'est cette valeur qui est affichée."],
      ["Que renvoie eval(\"10 + 20 * 3\") ?",["90","\"10 + 20 * 3\"","70","Une erreur"],2,"eval évalue l'expression avec les priorités usuelles : 10 + 60 = 70."],
      ["Pourquoi eval(input()) est-il dangereux ?",["Il est très lent","Il ne gère que les entiers","Il exécute n'importe quel code Python saisi par l'utilisateur","Il supprime les variables"],2,"Une entrée non fiable peut contenir du code malveillant exécuté directement."],
      ["Avec def f(x=2, y=1): return x**2 + y**2, que renvoie f(y=3) ?",["10","13","25","Une erreur"],1,"x garde sa valeur par défaut 2 : 4 + 9 = 13."],
      ["Avec la même fonction f(x=2, y=1), que renvoie f(3) ?",["10","13","9","Une erreur"],0,"Le 3 est affecté à x, y vaut 1 : 9 + 1 = 10."],
      ["Que affiche ?\n x = 10\n def g():\n     x = 5\n     return x\n print(g(), x)",["5 5","10 10","5 10","10 5"],2,"Dans g, x est une nouvelle variable locale qui masque la globale (toujours 10)."],
      ["Que se passe-t-il ?\n x = 10\n def h():\n     x = x + 1\n h()",["x vaut 11 ensuite","UnboundLocalError","SyntaxError","Rien, h renvoie None"],1,"x est affecté dans h donc local ; il est lu avant d'avoir une valeur, d'où l'erreur."],
      ["Avec def exterieur(a): def interieur(b): return b*b ; return interieur(a) + 1, que renvoie exterieur(4) ?",["9","16","17","Une erreur"],2,"interieur(4) = 16, puis + 1 = 17."],
      ["Avec def ma_fonction(n): return lambda a: a**(1/n), que vaut ma_fonction(2)(81) ?",["9.0","9","40.5","Une erreur"],0,"81 ** (1/2) = 9.0, un float à cause de l'exposant 1/2."],
      ["Avec carre = lambda x: x * x, que renvoie carre(carre(2)) ?",["4","8","16","256"],2,"carre(2) = 4 puis carre(4) = 16."],
      ["Quels mots-clés Python commencent par une majuscule ?",["True, False, None","if, else, while","def, class, lambda","import, from, as"],0,"Tous les mots-clés sont en minuscules sauf True, False et None."],
      ["À quoi sert le point-virgule dans a = 5 ; b = \"Bonjour\" ; c = 12.5 ?",["Terminer obligatoirement chaque ligne","Séparer plusieurs instructions sur une même ligne","Créer un tuple","Commenter la fin de ligne"],1,"Il est facultatif et sépare plusieurs instructions écrites sur une même ligne."],
      ["Comment écrire un commentaire multiligne autre qu'avec # à chaque ligne ?",["Une chaîne entre triples guillemets non affectée à une variable","/* ... */","<!-- ... -->","Des accolades { ... }"],0,"Une chaîne \"\"\" ... \"\"\" non affectée est ignorée et joue le rôle de commentaire."],
      ["Que renvoie 'Marge' in {'fils': 'Bart', 'mere': 'Marge'} ?",["True","False","Une erreur","'mere'"],1,"in teste les clés d'un dictionnaire, pas les valeurs."],
      ["Que renvoie not (3 > 4 or 2 > 1) ?",["True","False","None","Une erreur"],1,"(False or True) = True, et not True = False."],
      ["Que renvoie True and False or True ?",["False","True","None","Une erreur"],1,"and est prioritaire sur or : (True and False) or True = True."],
      ["Que vaut int(\"12\") + float(\"1.5\") ?",["13","13.5","\"121.5\"","Une erreur"],1,"12 + 1.5 = 13.5, un float."],
      ["Que se passe-t-il si l'utilisateur saisit 3.5 pour n = int(input(\"n : \")) ?",["n vaut 3","n vaut 4","n vaut 3.5","Une ValueError est levée"],3,"int(\"3.5\") est refusé : il faut passer par float() d'abord."],
      ["Que affiche : x = 5 ; x = \"Hello\" ; print(type(x)) ?",["<class 'int'>","<class 'str'>","Une erreur de type","<class 'float'>"],1,"Typage dynamique : x référence maintenant la chaîne \"Hello\"."],
      ["Quel est le type de \"100\" ?",["int","float","str","list"],2,"Les guillemets font de \"100\" une chaîne de caractères."],
      ["Que fait l'instruction from module import * ?",["Elle importe tous les éléments du module","Elle n'importe rien","Elle importe uniquement les fonctions","Elle supprime le module"],0,"L'étoile (joker) importe tous les éléments, au risque de collisions de noms."],
      ["Que provoque un if x > 0: suivi d'une ligne print('a') non indentée ?",["Rien, c'est valide","IndentationError","NameError","ZeroDivisionError"],1,"Après les deux-points, le bloc doit être indenté."],
      ["Après import math, que renvoie math.sqrt(4) ?",["2","2.0","16","Une erreur"],1,"sqrt renvoie toujours un float."],
      ["Avec a = 0 et if a > 0 / elif a < 0 / else (messages du cours), que s'affiche-t-il ?",["a est superieur a 0","a est inferieur a 0","a est nul","Aucun message"],2,"Ni a > 0 ni a < 0 : c'est le bloc else qui s'exécute."],
      ["Que fait from random import random as aleat puis aleat() ?",["Renvoie un entier aléatoire entre 0 et 4","Renvoie un flottant aléatoire dans [0, 1[","Provoque une collision de noms","Renvoie le module random"],1,"as crée un alias : aleat est random(), qui renvoie un flottant entre 0 inclus et 1 exclu."]
    ]
  }
};

const app = document.getElementById('app');
const LETTERS = ['A','B','C','D'];
let quiz, idx, score, answered, wrong;

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}

function menu(){
  app.innerHTML = '';
  app.appendChild(el('div','muted','$ python quiz.py'));
  app.appendChild(el('h1','','> PYTHON QUIZ_'));
  app.appendChild(el('div','muted','Basé sur le cours « Introduction au langage Python »'));
  const m = el('div','menu');
  for(const key of Object.keys(QUIZZES)){
    const q = QUIZZES[key];
    const b = el('button','', '');
    b.innerHTML = '';
    const t = el('span','tag','[' + (key === 'normal' ? '1' : '2') + '] ');
    b.appendChild(t);
    b.appendChild(document.createTextNode(q.title + ' — ' + q.questions.length + ' questions'));
    b.onclick = () => start(key);
    m.appendChild(b);
  }
  app.appendChild(m);
  const c = el('div','muted'); c.style.marginTop='20px';
  c.appendChild(document.createTextNode('Choisis un quiz '));
  c.appendChild(el('span','cursor'));
  app.appendChild(c);
}

function start(key){
  quiz = QUIZZES[key]; idx = 0; score = 0; wrong = [];
  show();
}

function show(){
  answered = false;
  const [q, opts, good, expl] = quiz.questions[idx];
  app.innerHTML = '';
  const head = el('div','muted', '$ ./' + quiz.title.toLowerCase().replace(' ','_') + '  [' + (idx+1) + '/' + quiz.questions.length + ']   score=' + score);
  app.appendChild(head);
  const prog = el('div','prog'); const bar = el('div'); bar.style.width = (idx/quiz.questions.length*100) + '%'; prog.appendChild(bar);
  app.appendChild(prog);
  app.appendChild(el('div','q', q));
  const box = el('div','opts');
  const buttons = [];
  opts.forEach((o,i) => {
    const b = el('button','opt', LETTERS[i] + ') ' + o);
    b.onclick = () => {
      if(answered) return;
      answered = true;
      buttons.forEach(x => x.disabled = true);
      if(i === good){ b.classList.add('ok'); score++; }
      else { b.classList.add('ko'); buttons[good].classList.add('ok'); wrong.push(idx); }
      ex.style.display = 'block';
      next.classList.remove('hidden');
    };
    buttons.push(b); box.appendChild(b);
  });
  app.appendChild(box);
  const ex = el('div','expl','>>> ' + expl);
  app.appendChild(ex);
  const row = el('div','row');
  const quit = el('button','','[ menu ]'); quit.onclick = menu;
  const next = el('button','hidden', idx === quiz.questions.length-1 ? '[ résultat ]' : '[ suivant → ]');
  next.onclick = () => { idx++; idx < quiz.questions.length ? show() : result(); };
  row.appendChild(quit); row.appendChild(next);
  app.appendChild(row);
}

function result(){
  app.innerHTML = '';
  const n = quiz.questions.length;
  const pct = Math.round(score/n*100);
  app.appendChild(el('div','muted','$ ./resultat --quiz ' + quiz.title.toLowerCase().replace(' ','_')));
  app.appendChild(el('h1','center','EXECUTION TERMINÉE'));
  app.appendChild(el('div','score', score + ' / ' + n));
  const msg = pct >= 90 ? 'Niveau : ROOT 👑' : pct >= 70 ? 'Niveau : DÉVELOPPEUR' : pct >= 50 ? 'Niveau : STAGIAIRE' : 'Niveau : DÉBUTANT — relis le cours !';
  const m = el('div','center tag', msg + ' (' + pct + '%)');
  app.appendChild(m);
  if(wrong.length){
    const h = el('div','muted','\nQuestions à revoir : ' + wrong.map(i => i+1).join(', '));
    h.style.cssText = 'margin-top:16px;white-space:pre-wrap';
    app.appendChild(h);
  }
  const row = el('div','row');
  const again = el('button','','[ recommencer ]');
  again.onclick = () => start(quiz === QUIZZES.normal ? 'normal' : 'hard');
  const mn = el('button','','[ menu ]'); mn.onclick = menu;
  row.appendChild(again); row.appendChild(mn);
  app.appendChild(row);
}

menu();
</script>
</body>
</html>
