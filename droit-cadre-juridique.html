<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadre juridique - Quiz | ECT.ma</title>
<style>
body{font-family:system-ui;background:#18181b;color:#fff;margin:0;padding:20px}
.container{max-width:800px;margin:auto}
.card{background:#27272a;padding:20px;border-radius:16px;margin:15px 0}
.btn{padding:10px 20px;border-radius:999px;border:1px solid #e6ff32;color:#e6ff32;background:transparent;cursor:pointer;margin:5px}
.btn.active{background:#e6ff32;color:#000}
.option{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #3f3f46;background:#3f3f46;color:#fff;cursor:pointer}
.option.correct{background:#22c55e} .option.wrong{background:#ef4444}
#progress{height:6px;background:#3f3f46;border-radius:99px;margin:15px 0} #bar{height:100%;background:#e6ff32;width:0%;border-radius:99px}
</style>
</head>
<body>
<div class="container">
<a href="droit.html" style="color:#e6ff32">← Retour Droit</a>
<h1>Cadre juridique de l'entreprise</h1>
<div><button class="btn active" id="btnStd" onclick="setLevel('std')">Standard (40 Q)</button>
<button class="btn" id="btnDiff" onclick="setLevel('diff')">Difficile (40 Q)</button></div>
<div id="progress"><div id="bar"></div></div>
<div id="quiz" class="card"></div>
<div style="display:flex;justify-content:space-between"><span id="score">0/0</span><button class="btn" onclick="nextQ()">Suivant →</button></div>
</div>
<script>
let level='std';
const data={
std:[
{q:"Qu'est-ce qu'une entreprise au sens juridique?",o:["Une personne physique","Une organisation autonome produisant des biens/services","Uniquement une société","Une administration"],a:1},
{q:"Personne physique c'est:",o:["Une société","Un individu avec droits et obligations","L'Etat","Un groupe"],a:1},
// زيد 38 سؤال هنايا بنفس الشكل...
{q:"Le commerçant est défini par:",o:["Article 6 du code de commerce","Article 1","Loi 17-95","Dahir"],a:0},
],
diff:[
{q:"Différence entre commerçant de fait et de droit?",o:["Aucune","De fait exerce sans registre, de droit immatriculé","De droit est illégal","De fait est une société"],a:1},
{q:"Le fonds de commerce comprend:",o:["Uniquement le local","Eléments corporels et incorporels","Uniquement les dettes","Uniquement le stock"],a:1},
// زيد 38 سؤال هنايا...
]
};
// باقي الكود باش يخدم الكويز
let i=0,sc=0;
function setLevel(l){level=l;document.getElementById('btnStd').classList.toggle('active',l=='std');document.getElementById('btnDiff').classList.toggle('active',l=='diff');i=0;sc=0;showQ()}
function showQ(){const q=data[level][i];document.getElementById('quiz').innerHTML=`<h3>Q${i+1}/${data[level].length} : ${q.q}</h3>`+q.o.map((op,idx)=>`<button class='option' onclick='check(${idx})'>${op}</button>`).join('');document.getElementById('bar').style.width=((i)/data[level].length*100)+'%';document.getElementById('score').innerText=`${sc}/${i}`}
function check(idx){const q=data[level][i];const btns=document.querySelectorAll('.option');if(idx==q.a){btns[idx].classList.add('correct');sc++;}else{btns[idx].classList.add('wrong');btns[q.a].classList.add('correct');}setTimeout(nextQ,800)}
function nextQ(){i++;if(i>=data[level].length){document.getElementById('quiz').innerHTML=`<h2>Terminé! Score ${sc}/${data[level].length}</h2><button class='btn' onclick='i=0;sc=0;showQ()'>Recommencer</button>`;return;}showQ()}
showQ();
</script>
</body>
</html>
